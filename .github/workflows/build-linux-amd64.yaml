name: Build Linux amd64
on:
  release:
    types: [created]
permissions:
  contents: write

jobs:
  build:
    name: Build Linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            portaudio19-dev

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build Binary
        run: |
          wails build -tags "fts5,webkit2_41" --ldflags="-X 'github.com/bragemusic/core/internal/vars.VERSION=${{ github.ref_name }}' -X 'github.com/bragemusic/core/internal/vars.PLATFORM=linux'"

      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv build/bin/brage-client build/bin/bragemusic-client-${{ github.ref_name }}-linux-amd64
          gh release upload "${{ github.ref_name }}" ./build/bin/bragemusic-client-${{ github.ref_name }}-linux-amd64
