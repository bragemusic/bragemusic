name: Release
on:
  release:
    types: [created]

permissions:
    contents: write
    packages: write

jobs:
  server-container:
    name: Build and Publish Server Container
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GHCR_FULL_NAME: 'ghcr.io/bragemusic/server:${{ github.ref_name }}'
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build, Tag and Push Image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker build --build-arg VERSION=${{ github.ref_name }} -f server.Dockerfile -t ${GHCR_FULL_NAME} -t ghcr.io/bragemusic/server:latest .
          docker push ${GHCR_FULL_NAME}
          docker push ghcr.io/bragemusic/server:latest

  desktop-client:
    name: Build and Publish Linux amd64 Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            portaudio19-dev

      - name: Add Go bin to PATH
        run: echo "$HOME/go/bin" >> "$GITHUB_PATH"

      - name: Install Wails
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend
        run: |
          npm install

      - name: Build Binary
        run: |
          wails build -tags "fts5,webkit2_41" --ldflags="-X 'github.com/bragemusic/core/internal/vars.VERSION=${{ github.ref_name }}' -X 'github.com/bragemusic/core/internal/vars.PLATFORM=linux'"

      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mv wails/build/bin/bragemusic wails/build/bin/bragemusic-client-${{ github.ref_name }}-linux-amd64
          gh release upload "${{ github.ref_name }}" ./wails/build/bin/bragemusic-client-${{ github.ref_name }}-linux-amd64
